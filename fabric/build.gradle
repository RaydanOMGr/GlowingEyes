plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    include modApi("org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}")
    include modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}")

    modCompileOnly "maven.modrinth:flashback:DDcDAzpe"
    modCompileOnly "maven.modrinth:female-gender:wxfN7iwN"
    modCompileOnly "maven.modrinth:replaymod:lrnVIO9F"

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}